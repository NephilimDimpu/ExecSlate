<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExecSlate — Set New Password</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='dark-theme.css') }}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>

<body>

    <div class="login-container">
        <div class="login-card fade-in">

            <h1>Set New Password</h1>
            <p>Enter a new password for your ExecSlate account.</p>

            {% if error %}
            <div class="error">
                <strong>⚠️</strong> {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/reset-password" class="login-form">
                <input type="hidden" name="token" value="{{ token }}">

                <div>
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 6 characters" required
                        autofocus minlength="6">
                </div>

                <div>
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Type password again" required minlength="6">
                </div>

                <button type="submit" class="btn-primary large">Update Password</button>
            </form>

        </div>
    </div>

    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Dark Mode" aria-label="Toggle dark mode">
        <span id="themeIcon">🌙</span>
    </button>

    <script src="{{ url_for('static', path='theme.js') }}"></script>
</body>

</html>
