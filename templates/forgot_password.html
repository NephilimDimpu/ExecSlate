<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExecSlate — Forgot Password</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='dark-theme.css') }}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>

<body>

    <div class="login-container">
        <div class="login-card fade-in">

            <h1>Reset Password</h1>
            <p>Enter your email address and we'll send you a link to reset your password.</p>

            {% if error %}
            <div class="error">
                <strong>⚠️</strong> {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/forgot-password" class="login-form">
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required autofocus>
                </div>

                <button type="submit" class="btn-primary large">Send Reset Link</button>
            </form>

            <div class="login-link-row">
                Remember your password? <a href="/login">Back to Login</a>
            </div>

        </div>
    </div>

    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Dark Mode" aria-label="Toggle dark mode">
        <span id="themeIcon">🌙</span>
    </button>

    <script src="{{ url_for('static', path='theme.js') }}"></script>
</body>

</html>
